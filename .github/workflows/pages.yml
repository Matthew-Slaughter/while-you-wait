name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the Chat/Cowork skill zip
        run: python3 scripts/build-skill-zip.py --out _site/while-you-wait-skill.zip
      - name: Assemble the site
        run: |
          cp -r site/. _site/
          cp _site/while-you-wait-skill.zip _site/while-you-wait.skill
          cp plugins/while-you-wait/data/devotionals.json _site/devotionals.json
          cp LICENSES.md _site/LICENSES.md
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
